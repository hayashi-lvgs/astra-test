name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GITHUB_PAGES: "true"
  NEXT_PUBLIC_ASSET_PREFIX: "/astra-test"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build product model
        run: |
          python -m pip install --disable-pip-version-check numpy trimesh
          python scripts/build_model.py

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Capture visual QA
        run: |
          rm -rf /tmp/lunev-pages-root
          mkdir -p /tmp/lunev-pages-root/astra-test
          cp -R out/. /tmp/lunev-pages-root/astra-test/
          nohup npx --yes serve@14 /tmp/lunev-pages-root -l 3000 > /tmp/pages-serve.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/astra-test/ > /dev/null; then
              break
            fi
            sleep 1
          done
          mkdir -p qa/fv
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          COMMON_FLAGS="--headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader --disable-gpu-sandbox"
          curl --fail --silent http://127.0.0.1:3000/astra-test/models/lunev-one.glb > /dev/null
          "$CHROME" $COMMON_FLAGS --user-data-dir=/tmp/lunev-chrome --window-size=1440,1000 --virtual-time-budget=18000 --run-all-compositor-stages-before-draw --screenshot=/tmp/fv-warm.png http://127.0.0.1:3000/astra-test/
          "$CHROME" $COMMON_FLAGS --user-data-dir=/tmp/lunev-chrome --window-size=1440,1000 --virtual-time-budget=12000 --run-all-compositor-stages-before-draw --screenshot=qa/fv/fv-desktop-1440.png http://127.0.0.1:3000/astra-test/
          "$CHROME" $COMMON_FLAGS --user-data-dir=/tmp/lunev-chrome-mobile --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=18000 --run-all-compositor-stages-before-draw --screenshot=qa/fv/fv-mobile-390.png http://127.0.0.1:3000/astra-test/

      - name: Upload visual QA
        uses: actions/upload-artifact@v4
        with:
          name: lunev-pages-fv
          path: qa/fv/*.png
          retention-days: 14

      - name: Capture exported site screenshots
        run: |
          nohup python3 -m http.server 4173 --directory out > /tmp/pages-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/astra-test/ > /dev/null; then break; fi
            sleep 1
          done
          mkdir -p qa/pages
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          COMMON_FLAGS="--headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader --disable-gpu-sandbox"
          "$CHROME" $COMMON_FLAGS --window-size=1440,1000 --virtual-time-budget=15000 --screenshot=qa/pages/fv-desktop-1440.png http://127.0.0.1:4173/astra-test/
          "$CHROME" $COMMON_FLAGS --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=15000 --screenshot=qa/pages/fv-mobile-390.png http://127.0.0.1:4173/astra-test/
          "$CHROME" $COMMON_FLAGS --window-size=1440,1000 --virtual-time-budget=15000 --screenshot=qa/pages/section-sound.png http://127.0.0.1:4173/astra-test/#sound
          "$CHROME" $COMMON_FLAGS --window-size=1440,1000 --virtual-time-budget=15000 --screenshot=qa/pages/section-material.png http://127.0.0.1:4173/astra-test/#material
          "$CHROME" $COMMON_FLAGS --window-size=1440,1000 --virtual-time-budget=15000 --screenshot=qa/pages/section-explore.png http://127.0.0.1:4173/astra-test/#explore
          "$CHROME" $COMMON_FLAGS --window-size=1440,1000 --virtual-time-budget=15000 --screenshot=qa/pages/section-customize.png http://127.0.0.1:4173/astra-test/#customize

      - name: Upload QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: lunev-pages-qa
          path: qa/pages/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
