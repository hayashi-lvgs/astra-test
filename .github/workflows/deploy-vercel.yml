name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Production build check
        run: npm run build

      - name: Verify Vercel token
        if: env.VERCEL_TOKEN != ''
        run: |
          STATUS=$(curl -sS -o /tmp/vercel-user.json -w "%{http_code}" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user)
          echo "Vercel /v2/user HTTP status: $STATUS"
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/vercel-user.json','utf8')); if(j.user){console.log('Authenticated Vercel user:', j.user.username || j.user.name || j.user.uid);} else {console.log('Vercel auth response:', j.error?.code || 'unknown_error', '-', j.error?.message || 'No user returned');}"
          test "$STATUS" = "200"

      - name: Configure Vercel project
        if: env.VERCEL_TOKEN != ''
        run: |
          npx vercel@latest project add lunev-one --token="$VERCEL_TOKEN" || true
          npx vercel@latest link --yes --project lunev-one --token="$VERCEL_TOKEN"
          npx vercel@latest project update lunev-one --framework nextjs --auto-detect output-directory --yes --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != ''
        run: npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Capture FV screenshots
        run: |
          mkdir -p qa/fv
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "Chrome: $CHROME"
          curl --retry 8 --retry-delay 2 --retry-all-errors --fail --silent --show-error https://lunev-one.vercel.app/ > /dev/null
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --use-gl=swiftshader --enable-webgl --window-size=1440,1000 --virtual-time-budget=10000 --screenshot=qa/fv/fv-desktop-1440.png https://lunev-one.vercel.app/
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --use-gl=swiftshader --enable-webgl --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=10000 --screenshot=qa/fv/fv-mobile-390.png https://lunev-one.vercel.app/
          file qa/fv/*.png

      - name: Upload FV screenshots
        uses: actions/upload-artifact@v4
        with:
          name: lunev-fv-screenshots
          path: qa/fv/*.png
          if-no-files-found: error
          retention-days: 14
