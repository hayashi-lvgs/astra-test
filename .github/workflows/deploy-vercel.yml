name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: lunev-one
      VERCEL_TEAM_ID: team_aQ7QgiBFMyGISISEyGngP7Ef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build product model
        run: |
          python -m pip install --disable-pip-version-check numpy trimesh
          python scripts/build_model.py
          ls -lh public/models/lunev-one.glb

      - name: Install dependencies
        run: npm install

      - name: Production build check
        run: npm run build

      - name: Start production server
        run: |
          nohup npm run start -- -p 3000 > /tmp/lunev-next.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "Local production server ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lunev-next.log
          exit 1

      - name: Capture FV screenshots
        run: |
          mkdir -p qa/fv
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          COMMON_FLAGS="--headless=new --no-sandbox --disable-dev-shm-usage --hide-scrollbars --enable-webgl --ignore-gpu-blocklist --use-angle=swiftshader --enable-unsafe-swiftshader --disable-gpu-sandbox"
          "$CHROME" $COMMON_FLAGS --window-size=1440,1000 --virtual-time-budget=15000 --screenshot=qa/fv/fv-desktop-1440.png http://127.0.0.1:3000/
          "$CHROME" $COMMON_FLAGS --window-size=390,844 --force-device-scale-factor=1 --virtual-time-budget=15000 --screenshot=qa/fv/fv-mobile-390.png http://127.0.0.1:3000/

      - name: Upload FV screenshots
        uses: actions/upload-artifact@v4
        with:
          name: lunev-fv-screenshots
          path: qa/fv/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Resolve existing Vercel project
        run: |
          set -euo pipefail

          STATUS=$(curl -sS -o /tmp/vercel-project.json -w "%{http_code}"             -H "Authorization: Bearer $VERCEL_TOKEN"             "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_NAME?teamId=$VERCEL_TEAM_ID")

          echo "Project lookup status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            cat /tmp/vercel-project.json
            exit 1
          fi

          PROJECT_ID=$(node -e "const j=require('/tmp/vercel-project.json'); process.stdout.write(j.id || '')")
          test -n "$PROJECT_ID"

          mkdir -p .vercel
          node -e "const fs=require('fs'); fs.writeFileSync('.vercel/project.json', JSON.stringify({projectId:process.argv[1], orgId:process.argv[2]}, null, 2))" "$PROJECT_ID" "$VERCEL_TEAM_ID"

      - name: Deploy to Vercel
        run: |
          npx vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" | tee /tmp/vercel-deploy.log

      - name: Show deployment URL
        run: |
          echo "Production deployment:"
          grep -Eo 'https://[^ ]+\.vercel\.app' /tmp/vercel-deploy.log | tail -n 1
